# The databases are a convenience for when no database is at hand. Each belongs to a profile, so
#   docker compose --profile postgres up -d     starts the app and PostgreSQL
#   docker compose --profile oracle up -d       starts the app and Oracle
#   docker compose up -d app                    starts only the app (DATABASE_URL points to an external database)
# Naming a service (docker compose up -d db oracle) starts it regardless of the profiles.
services:
  db:
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Oracle Database 23ai Free (native JSON column type), arm64 + amd64.
  # Creates the application schema APP_USER in the pluggable DB FREEPDB1.
  oracle:
    profiles: ["oracle"]
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      APP_USER: ${ORACLE_APP_USER}
      APP_USER_PASSWORD: ${ORACLE_APP_PASSWORD}
    volumes:
      - oracle_data:/opt/oracle/oradata
    ports:
      - "1521:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Backend is selected via DATABASE_URL (see .env): a database of this stack (host `db` / `oracle`) or an external
  # one, e.g.
  #   DATABASE_URL=oracle+oracledb_async://app:secret@dbhost:1521/?service_name=FREEPDB1 docker compose up -d app
  # The entrypoint waits until the configured DB accepts connections and migrates it.
  app:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SQL_ECHO: ${SQL_ECHO:-false}
      HISTORY_ENABLED: ${HISTORY_ENABLED:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"  # event callbacks to a listener on the host (Linux needs this)
    ports:
      - "8080:8000"

volumes:
  postgres_data:
  oracle_data:
