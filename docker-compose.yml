# The databases are a convenience for when no database is at hand. Each belongs to a profile, so
#   docker compose --profile postgres up -d     starts the app and PostgreSQL
#   docker compose --profile oracle up -d       starts the app and Oracle
#   docker compose up -d app                    starts only the app (DATABASE_URL points to an external database)
# Naming a service (docker compose up -d db oracle) starts it regardless of the profiles.
services:
  db:
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Oracle Database 23ai Free (native JSON column type), arm64 + amd64.
  # Creates the application schema APP_USER in the pluggable DB FREEPDB1.
  oracle:
    profiles: ["oracle"]
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      APP_USER: ${ORACLE_APP_USER}
      APP_USER_PASSWORD: ${ORACLE_APP_PASSWORD}
    volumes:
      - oracle_data:/opt/oracle/oradata
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Backend is selected via DATABASE_URL (see .env): a database of this stack (host `db` / `oracle`) or an external
  # one, e.g.
  #   DATABASE_URL=oracle+oracledb_async://app:secret@dbhost:1521/?service_name=FREEPDB1 docker compose up -d app
  # The entrypoint waits until the configured DB accepts connections and migrates it.
  app:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SQL_ECHO: ${SQL_ECHO:-false}
      HISTORY_ENABLED: ${HISTORY_ENABLED:-false}
      # Authentication (README, *Authentication*): none | basic | oauth2
      AUTH_MODE: ${AUTH_MODE:-none}
      AUTH_BASIC_USERS: ${AUTH_BASIC_USERS:-}
      OAUTH2_ISSUER: ${OAUTH2_ISSUER:-}
      OAUTH2_JWKS_URL: ${OAUTH2_JWKS_URL:-}
      OAUTH2_AUDIENCE: ${OAUTH2_AUDIENCE:-}
      OAUTH2_ROLES_CLAIM: ${OAUTH2_ROLES_CLAIM:-realm_access.roles}
    ports:
      - "${APP_PORT:-8080}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Optional OAuth2 / OpenID Connect provider for AUTH_MODE=oauth2 (profile `keycloak`): the realm `tmf` is imported
  # from keycloak/tmf-realm.json. Tokens carry the issuer ${KEYCLOAK_PUBLIC_URL}/realms/tmf (KC_HOSTNAME) whichever
  # way the caller reached Keycloak; the app fetches the signing keys from the internal address (OAUTH2_JWKS_URL).
  keycloak:
    profiles: ["keycloak"]
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:${KEYCLOAK_PORT:-8180}}
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_APPEND: "-XX:UseSVE=0"  # JDK 21 crashes with SIGILL on some arm64 hosts (SVE)
    volumes:
      - ./keycloak/tmf-realm.json:/opt/keycloak/data/import/tmf-realm.json:ro
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    healthcheck:
      # the image has no curl: speak HTTP to the management port by hand
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  postgres_data:
  oracle_data:
